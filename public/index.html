<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <meta name="description" content="최부장의 비밀창고는 보호된 메모 자료실과 기기 승인 절차를 제공하는 설치형 웹앱입니다.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth-panel { margin: 24px 0; padding: 22px; border: 1px solid #51667c; border-radius: 8px; background: #1a2a3d; }
    .auth-panel h2 { margin-top: 0; font-size: 21px; }
    .auth-form { display: grid; gap: 14px; }
    .auth-form label { display: grid; gap: 6px; color: #bfd0e5; }
    .auth-form input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #71849a; border-radius: 4px; background: #101a28; color: #ecf4ff; font: inherit; }
    button { min-height: 44px; padding: 9px 14px; border: 1px solid #8ad8df; border-radius: 4px; background: #183b45; color: #ecf4ff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled, input:disabled { opacity: .6; cursor: not-allowed; }
    #auth-status[data-kind="error"] { color: #ffb8c2; }
    .account-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .account-row p { overflow-wrap: anywhere; }
    .note-editor { display: grid; gap: 14px; margin-top: 20px; }
    .note-editor label { display: grid; gap: 6px; color: #bfd0e5; }
    .note-editor input, .note-editor textarea { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #71849a; border-radius: 4px; background: #101a28; color: #ecf4ff; font: inherit; }
    .note-editor textarea { min-height: 140px; resize: vertical; }
    .note-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    #notes li button { width: 100%; text-align: left; }
    #notes-status[data-kind="error"] { color: #ffb8c2; }
    .device-panel { margin: 24px 0; padding: 20px; border: 1px solid #51667c; border-radius: 10px; background: rgba(18, 32, 46, 0.9); }
    .device-panel h2 { margin-top: 0; }
    .device-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .device-status { display: inline-flex; align-items: center; min-height: 32px; padding: 6px 10px; border-radius: 999px; background: #203045; color: #dfeaf7; font-size: 14px; font-weight: 700; }
    .device-status[data-state="approved"] { background: rgba(52, 122, 86, 0.28); color: #dffbe8; }
    .device-status[data-state="pending"] { background: rgba(196, 154, 62, 0.22); color: #fff0c6; }
    .device-status[data-state="rejected"] { background: rgba(166, 80, 80, 0.28); color: #ffdfe3; }
    .device-status[data-state="unregistered"] { background: rgba(108, 128, 146, 0.22); color: #dfeaf7; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 진짜 로그인</div>
    <h1>최부장의 비밀창고</h1>
    <div class="notice">로그인한 세션의 토큰을 서버에서 검증한 뒤 보호된 메모를 불러옵니다.</div>
    <section id="install-panel" class="device-panel" aria-labelledby="install-heading">
      <h2 id="install-heading">설치형 웹앱</h2>
      <p>이 자료실은 설치 가능한 PWA이며, 브라우저가 지원할 때 앱 설치 버튼을 사용할 수 있습니다.</p>
      <div class="device-row">
        <button id="install-button" type="button" hidden>앱 설치</button>
        <button id="offline-refresh" type="button">오프라인 안내 다시 확인</button>
      </div>
      <p id="install-status" role="status" aria-live="polite">설치 상태를 확인하는 중입니다.</p>
    </section>
    <section id="device-panel" class="device-panel" aria-labelledby="device-heading">
      <h2 id="device-heading">기기 승인 상태</h2>
      <div class="device-row">
        <span id="device-status" class="device-status" data-state="unregistered">미등록</span>
        <button id="device-request-button" type="button">기기 승인 요청</button>
        <button id="device-revoke-button" type="button" hidden>이 기기 승인 취소</button>
      </div>
      <p id="device-message" role="status" aria-live="polite">로그인 후 기기 승인 상태를 확인합니다.</p>
    </section>
    <section id="login-panel" class="auth-panel" aria-labelledby="login-heading">
      <h2 id="login-heading">로그인</h2>
      <form id="login-form" class="auth-form">
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
    </section>
    <section id="account-panel" class="auth-panel" aria-label="로그인 계정" hidden>
      <div class="account-row">
        <p id="account-email"></p>
        <button id="logout-button" type="button" disabled>로그아웃</button>
      </div>
      <h2>자료실 메모</h2>
      <p>메모를 선택해 내용을 확인하거나 새 메모를 작성할 수 있습니다.</p>
      <div class="note-actions">
        <button id="new-note" type="button" disabled>새 메모</button>
        <button id="reload-notes" type="button" disabled>목록 새로고침</button>
      </div>
      <p id="notes-status" role="status" aria-live="polite">로그인하면 메모를 불러옵니다.</p>
      <ul id="notes" aria-live="polite"></ul>
      <form id="note-form" class="note-editor" hidden>
        <h3 id="note-form-heading">새 메모</h3>
        <label for="note-title">제목</label>
        <input id="note-title" name="title" maxlength="200" required>
        <label for="note-body">내용</label>
        <textarea id="note-body" name="body" maxlength="20000" required></textarea>
        <div class="note-actions">
          <button id="save-note" type="submit" disabled>저장</button>
          <button id="delete-note" type="button" disabled hidden>삭제</button>
          <button id="cancel-edit" type="button" disabled>닫기</button>
        </div>
      </form>
    </section>
    <p id="auth-status" role="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
  </main>
  <script type="module" src="/auth-browser.mjs"></script>
</body>
</html>
